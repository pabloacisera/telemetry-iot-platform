# Mosquitto configuration for the single-container Render Free image.
#
# Identical to mosquitto.conf except the broker binds to loopback only.
# On Render everything that talks to the broker (backend + simulator) runs in
# the same container, so 1883 must not be exposed. Keeping it on 127.0.0.1
# stops Render's port scanner from probing it and avoids confusing Render's
# HTTP port detection with a second, non-HTTP listener.

listener 1883 127.0.0.1
protocol mqtt

# Authentication
allow_anonymous false
password_file /mosquitto/config/password_file

# Authorization
acl_file /mosquitto/config/acl_file

# Persistence (retain messages survive broker restart)
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice

# Publish $SYS topics every 5 seconds (required for healthcheck)
sys_interval 5

# Queue limit for offline clients (QoS 1 messages held while disconnected)
max_queued_messages 1000

# Keep sessions for reconnecting clients
persistent_client_expiration 24h
