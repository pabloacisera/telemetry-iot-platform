# Mosquitto configuration for IoT Telemetry Platform
# No anonymous access — every client must authenticate
# ACL enforces per-device topic isolation

listener 1883
protocol mqtt

# Authentication
allow_anonymous false
password_file /mosquitto/config/password_file

# Authorization
acl_file /mosquitto/config/acl_file

# Persistence (retain messages survive broker restart)
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice

# Publish $SYS topics every 5 seconds (required for healthcheck)
sys_interval 5

# Queue limit for offline clients (QoS 1 messages held while disconnected)
max_queued_messages 1000

# Keep sessions for reconnecting clients
persistent_client_expiration 24h
