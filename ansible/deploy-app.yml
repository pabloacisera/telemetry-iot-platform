---
# =============================================================================
# Ansible playbook: Desplegar cualquier app en la EC2
# =============================================================================
#
# Arquitectura: Cloudflare → tunnel (cloudflared) → nginx → app
#
# Uso:
#   cd ansible
#   ansible-playbook deploy-app.yml -i inventory.ini \
#     -e "app_name=tienda" \
#     -e "app_subdomains=tienda.artisandevs.site,pagos.artisandevs.site" \
#     -e "tunnel_name=mi-tunnel"
#
# Con migraciones:
#   ansible-playbook deploy-app.yml -i inventory.ini \
#     -e "app_name=tienda" \
#     -e "app_subdomains=tienda.artisandevs.site" \
#     -e "tunnel_name=mi-tunnel" \
#     -e "run_migrations=true"
#
# Prerrequisitos en la EC2:
#   - Docker + Docker Compose v2 instalado
#   - nginx-global corriendo en /opt/infra
#   - cloudflared configurado con un tunnel activo
#   - Carpeta /opt/infra/conf.d/ para configs de nginx
#
# Prerrequisitos en tu máquina local:
#   - Ansible instalado (sudo apt install ansible)
#   - SSH key configurada para conectar a la EC2
#   - Archivo ansible/files/nginx/<app_name>.conf creado
#   - Archivo docker-compose.yml en la raíz del proyecto
# =============================================================================

- name: "Deploy app: {{ app_name }}"
  hosts: production
  become: true

  vars:
    # Variables obligatorias (el usuario debe pasarlas con -e)
    app_name: "{{ app_name }}"
    app_subdomains: "{{ app_subdomains | default('') }}"
    tunnel_name: "{{ tunnel_name }}"

    # Variables opcionales
    run_migrations: "{{ run_migrations | default(false) }}"

    # Rutas fijas (no cambiar)
    deploy_path: "/opt/apps/{{ app_name }}"
    nginx_conf_dir: "/opt/infra/conf.d"
    nginx_config_src: "{{ playbook_dir }}/files/nginx/{{ app_name }}.conf"

  tasks:
    # =========================================================================
    # 1. Crear carpeta de la app
    # =========================================================================
    - name: "Paso 1: Crear carpeta /opt/apps/{{ app_name }}"
      file:
        path: "{{ deploy_path }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    # =========================================================================
    # 2. Crear red Docker (garantía; docker compose ahora la auto-crea con
    #    networks: name: <app_name>-net, así que este paso es idempotente)
    # =========================================================================
    - name: "Paso 2: Crear red Docker {{ app_name }}-net"
      command: "docker network create {{ app_name }}-net"
      register: network_result
      changed_when: "'already exists' not in network_result.stderr"
      failed_when: network_result.rc != 0 and 'already exists' not in network_result.stderr

    # =========================================================================
    # 3. Copiar archivos del proyecto
    # =========================================================================
    - name: "Paso 3: Sincronizar archivos del proyecto a {{ deploy_path }}"
      synchronize:
        src: "{{ playbook_dir }}/../"
        dest: "{{ deploy_path }}/"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=.venv"
          - "--exclude=__pycache__"
          - "--exclude=dist"
          - "--exclude=coverage"
          - "--exclude=ansible"
        delete: true

    # =========================================================================
    # 4. Copiar .env (si existe)
    # =========================================================================
    - name: "Paso 4: Verificar si existe .env.production"
      stat:
        path: "{{ playbook_dir }}/files/.env.production"
      register: env_file

    - name: "Paso 4: Copiar archivo .env"
      copy:
        src: "{{ playbook_dir }}/files/.env.production"
        dest: "{{ deploy_path }}/.env"
        owner: ec2-user
        group: ec2-user
        mode: "0600"
      when: env_file.stat.exists

    # =========================================================================
    # 5. Conectar red de la app a nginx-global
    # =========================================================================
    - name: "Paso 5: Conectar {{ app_name }}-net a nginx-global"
      command: "docker network connect {{ app_name }}-net nginx-global"
      register: connect_result
      changed_when: "'already connected' not in connect_result.stderr"
      failed_when: connect_result.rc != 0 and 'already connected' not in connect_result.stderr

    # =========================================================================
    # 6. Crear config nginx
    # =========================================================================
    - name: "Paso 6: Verificar si existe config nginx"
      stat:
        path: "{{ nginx_config_src }}"
      register: nginx_config_file

    - name: "Paso 6: Copiar config nginx a {{ nginx_conf_dir }}/{{ app_name }}.conf"
      copy:
        src: "{{ nginx_config_src }}"
        dest: "{{ nginx_conf_dir }}/{{ app_name }}.conf"
        owner: ec2-user
        group: ec2-user
        mode: "0644"
      register: nginx_config
      when: nginx_config_file.stat.exists

    - name: "Paso 6: Aviso si no existe config nginx"
      debug:
        msg: "No se encontró {{ nginx_config_src }}. Crea la config nginx antes de continuar."
      when: not nginx_config_file.stat.exists

    # =========================================================================
    # 7. Registrar subdominios en el tunnel
    # =========================================================================
    - name: "Paso 7: Registrar subdominios en tunnel {{ tunnel_name }}"
      command: "cloudflared tunnel route dns {{ tunnel_name }} {{ item }}"
      loop: "{{ app_subdomains | split(',') if app_subdomains | length > 0 else [] }}"
      register: dns_result
      changed_when: "'already exists' not in dns_result.stderr"
      when: app_subdomains | length > 0

    # =========================================================================
    # 8. Recargar nginx
    # =========================================================================
    - name: "Paso 8: Validar configuración de nginx"
      command: docker exec nginx-global nginx -t
      changed_when: false

    - name: "Paso 8: Recargar nginx (sin reiniciar)"
      command: docker exec nginx-global nginx -s reload
      when: nginx_config.changed | default(false)

    # =========================================================================
    # 9. Ejecutar migraciones (opcional)
    #    NOTA: el backend de este proyecto ya ejecuta `prisma migrate deploy`
    #    al arrancar (ver backend/Dockerfile). Si una app necesita correrlas
    #    aquí, ajustar el nombre del servicio correspondiente (ej: telemetry-backend-nestjs).
    # =========================================================================
    - name: "Paso 9: Ejecutar migraciones de base de datos"
      command: "docker compose exec -T {{ migration_service | default('backend') }} npx prisma migrate deploy"
      args:
        chdir: "{{ deploy_path }}"
      when: run_migrations | bool
      register: migration_result

    - name: "Paso 9: Mostrar resultado de migraciones"
      debug:
        var: migration_result.stdout
      when: run_migrations | bool and migration_result.changed

    # =========================================================================
    # 10. Levantar la app
    # =========================================================================
    - name: "Paso 10: Levantar {{ app_name }} con docker compose"
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_path }}"
        state: present
        build: policy
      register: compose_result

    - name: "Paso 10: Mostrar resultado de docker compose"
      debug:
        var: compose_result.stdout
      when: compose_result.changed

    # =========================================================================
    # Resumen
    # =========================================================================
    - name: "✅ Despliegue completado"
      debug:
        msg:
          - "App: {{ app_name }}"
          - "Carpeta: {{ deploy_path }}"
          - "Red: {{ app_name }}-net"
          - "Subdominios: {{ app_subdomains | default('ninguno') }}"
          - "Tunnel: {{ tunnel_name }}"
          - "Migraciones: {{ 'ejecutadas' if run_migrations | bool else 'omitidas' }}"
