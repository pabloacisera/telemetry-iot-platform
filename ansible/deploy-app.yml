---
# =============================================================================
# Ansible playbook: Desplegar cualquier app en la EC2
# =============================================================================
#
# Arquitectura: Cloudflare → túnel (cloudflared) → nginx-global:80 → <app>-nginx
#
#   - El nginx-global es "tonto": solo rutea el subdominio al nginx de cada app.
#   - Cada app vive en /opt/apps/<app>/ con su PROPIO nginx (contenedor
#     <app>-nginx, puerto 80 interno), su red <app>-net (la crea docker compose)
#     y su docker-compose.yml. El routing interno (/api, /socket.io, DB, etc.)
#     lo hace el nginx de la app, NO el global.
#   - Ansible conecta <app>-net a nginx-global (docker network connect) para que
#     el global resuelva el nombre <app>-nginx.
#
# Uso:
#   cd ansible
#   ansible-playbook deploy-app.yml -i inventory.ini \
#     -e "app_name=tienda" \
#     -e "app_subdomains=tienda.artisandevs.site,pagos.artisandevs.site" \
#     -e "tunnel_name=mi-tunnel"
#
# Con migraciones:
#   ansible-playbook deploy-app.yml -i inventory.ini \
#     -e "app_name=tienda" -e "app_subdomains=tienda.artisandevs.site" \
#     -e "tunnel_name=mi-tunnel" -e "run_migrations=true"
#
# Prerrequisitos en la EC2 (etapa manual, una sola vez):
#   - Docker + Docker Compose v2 instalado
#   - nginx-global corriendo en /opt/infra (puerto 80)
#   - cloudflared instalado y túnel creado (login hecho)
#   - Carpeta /opt/infra/conf.d/ para configs de nginx
#
# Prerrequisitos en tu máquina local:
#   - Ansible instalado (venv) + SSH key configurada
#   - Archivo ansible/files/nginx/<app_name>.conf (conf GLOBAL mínimo)
#   - Archivo docker-compose.yml en la raíz del proyecto que declare:
#       networks:
#         <app_name>-net:
#           name: <app_name>-net
#     y un servicio <app_name>-nginx (nginx de la app) con su conf montado.
# =============================================================================

- name: "Deploy app: {{ app_name }}"
  hosts: production
  become: true

  vars:
    # Variables opcionales (app_name, app_subdomains y tunnel_name vienen con -e)
    run_migrations: "{{ run_migrations | default(false) }}"

    # Rutas fijas (no cambiar)
    deploy_path: "/opt/apps/{{ app_name }}"
    app_network: "{{ app_name }}-net"
    nginx_conf_dir: "/opt/infra/conf.d"
    nginx_config_src: "{{ playbook_dir }}/files/nginx/{{ app_name }}.conf"

  tasks:
    # =========================================================================
    # 1. Crear carpeta de la app
    # =========================================================================
    - name: "Paso 1: Crear carpeta /opt/apps/{{ app_name }}"
      file:
        path: "{{ deploy_path }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    # =========================================================================
    # 2. Copiar archivos del proyecto (la red <app>-net la crea docker compose)
    # =========================================================================
    - name: "Paso 2: Sincronizar archivos del proyecto a {{ deploy_path }}"
      synchronize:
        src: "{{ playbook_dir }}/../"
        dest: "{{ deploy_path }}/"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=.venv"
          - "--exclude=__pycache__"
          - "--exclude=dist"
          - "--exclude=coverage"
          - "--exclude=ansible"
        delete: true

    # =========================================================================
    # 3. Copiar .env (si existe)
    # =========================================================================
    - name: "Paso 3: Verificar si existe .env.production"
      stat:
        path: "{{ playbook_dir }}/files/.env.production"
      register: env_file

    - name: "Paso 3: Copiar archivo .env"
      copy:
        src: "{{ playbook_dir }}/files/.env.production"
        dest: "{{ deploy_path }}/.env"
        owner: ec2-user
        group: ec2-user
        mode: "0600"
      when: env_file.stat.exists

    # =========================================================================
    # 4. Levantar la app con docker compose (crea <app>-net automáticamente)
    # =========================================================================
    - name: "Paso 4: Levantar {{ app_name }} con docker compose"
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_path }}"
        state: present
        build: policy
      register: compose_result

    - name: "Paso 4: Mostrar resultado de docker compose"
      debug:
        var: compose_result.stdout
      when: compose_result.changed

    # =========================================================================
    # 5. Conectar red de la app a nginx-global (después de crear la red)
    # =========================================================================
    - name: "Paso 5: Conectar {{ app_network }} a nginx-global"
      command: "docker network connect {{ app_network }} nginx-global"
      register: connect_result
      changed_when: "'already connected' not in connect_result.stderr"
      failed_when: connect_result.rc != 0 and 'already connected' not in connect_result.stderr

    # =========================================================================
    # 6. Crear config nginx (conf GLOBAL mínimo)
    # =========================================================================
    - name: "Paso 6: Verificar si existe config nginx"
      stat:
        path: "{{ nginx_config_src }}"
      register: nginx_config_file

    - name: "Paso 6: Copiar config nginx a {{ nginx_conf_dir }}/{{ app_name }}.conf"
      copy:
        src: "{{ nginx_config_src }}"
        dest: "{{ nginx_conf_dir }}/{{ app_name }}.conf"
        owner: ec2-user
        group: ec2-user
        mode: "0644"
      register: nginx_config
      when: nginx_config_file.stat.exists

    - name: "Paso 6: Aviso si no existe config nginx"
      debug:
        msg: "No se encontró {{ nginx_config_src }}. Crea la config nginx antes de continuar."
      when: not nginx_config_file.stat.exists

    # =========================================================================
    # 7. Registrar subdominios en el túnel (corre como ec2-user, dueño del cert)
    # =========================================================================
    - name: "Paso 7: Registrar subdominios en tunnel {{ tunnel_name }}"
      command: "cloudflared tunnel route dns {{ tunnel_name }} {{ item }}"
      loop: "{{ app_subdomains | split(',') if app_subdomains | length > 0 else [] }}"
      become: false
      register: dns_result
      changed_when: "'already exists' not in dns_result.stderr"
      when: app_subdomains | length > 0

    # =========================================================================
    # 8. Recargar nginx (nunca reiniciar)
    # =========================================================================
    - name: "Paso 8: Validar configuración de nginx"
      command: docker exec nginx-global nginx -t
      changed_when: false

    - name: "Paso 8: Recargar nginx (sin reiniciar)"
      command: docker exec nginx-global nginx -s reload
      when: nginx_config.changed | default(false)

    # =========================================================================
    # 9. Ejecutar migraciones (opcional)
    #    El backend de este proyecto ya ejecuta `prisma migrate deploy` al
    #    arrancar (ver backend/Dockerfile). Para otras apps, ajustar el servicio.
    # =========================================================================
    - name: "Paso 9: Ejecutar migraciones de base de datos"
      command: "docker compose exec -T {{ migration_service | default('backend') }} npx prisma migrate deploy"
      args:
        chdir: "{{ deploy_path }}"
      when: run_migrations | bool
      register: migration_result

    - name: "Paso 9: Mostrar resultado de migraciones"
      debug:
        var: migration_result.stdout
      when: run_migrations | bool and migration_result.changed

    # =========================================================================
    # Resumen
    # =========================================================================
    - name: "Despliegue completado"
      debug:
        msg:
          - "App: {{ app_name }}"
          - "Carpeta: {{ deploy_path }}"
          - "Red: {{ app_network }} (creada por docker compose)"
          - "Entry point: {{ app_name }}-nginx:80 (ruteado por nginx-global)"
          - "Subdominios: {{ app_subdomains | default('ninguno') }}"
          - "Tunnel: {{ tunnel_name }}"
          - "Migraciones: {{ 'ejecutadas' if run_migrations | bool else 'omitidas' }}"
