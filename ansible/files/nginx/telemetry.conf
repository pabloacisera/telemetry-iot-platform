# telemetry — conf GLOBAL mínimo (nginx-global)
# El global NO conoce los internos de la app: solo redirige el subdominio
# al nginx de la aplicación (telemetry-nginx), que vive en su red interna.
# Todo el routing interno (/api, /socket.io, /grafana) lo hace telemetry-nginx.
server {
    listen 80;
    server_name telemetry.artisandevs.site;

    location / {
        proxy_pass http://telemetry-nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
