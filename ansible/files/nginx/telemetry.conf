# Telemetry platform — nginx-global routing
# Solo el frontend tiene subdominio (telemetry.artisandev.site).
# Backend y el resto de servicios viven en la red interna telemetry-net.
# El prefijo /api NO existe en el backend NestJS (rutas en /), por eso se elimina con proxy_pass /.

server {
    listen 80;
    server_name telemetry.artisandevs.site;

    # Frontend (servido por el frontend container, sin nginx propio)
    location / {
        proxy_pass http://frontend-react:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (el proxy_pass termina en / para eliminar el prefijo /api)
    location /api/ {
        proxy_pass http://backend-nestjs:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana (acceso directo desde el header del dashboard, bajo /grafana/)
    # Requiere GF_SERVER_ROOT_URL=https://telemetry.artisandevs.site/grafana/
    location /grafana/ {
        proxy_pass http://dashboard-grafana:3000/grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (socket.io)
    location /socket.io/ {
        proxy_pass http://backend-nestjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}