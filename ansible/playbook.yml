---
# Ansible playbook for deploying the IoT Telemetry Platform to EC2.
#
# What it does (idempotent — safe to run multiple times):
# 1. Copies the project to /opt/apps/telemetry/ on the EC2.
# 2. Copies the production .env file.
# 3. Runs docker compose up -d (builds and starts all 8 containers).
# 4. Connects telemetry-net to nginx-global (so the global Nginx reaches the app).
# 5. Copies the Nginx site config (files/nginx/telemetry.conf — /, /api/, /socket.io/, /grafana/).
# 6. Validates and reloads global Nginx (never restarts it).
#
# Usage:
#   cd ansible
#   ansible-playbook playbook.yml -i inventory.ini
#
# Prerequisites on the EC2:
#   - Docker + Docker Compose v2 installed
#   - Global Nginx container running at /home/ec2-user/global/nginx
#   - cloudflared tunnel configured for the domain

- name: Deploy IoT Telemetry Platform
  hosts: production
  become: true
  vars:
    project_name: telemetry
    deploy_path: /opt/apps/{{ project_name }}
    nginx_conf_dir: /opt/infra/conf.d
    app_domain: telemetry.artisandevs.site

  tasks:
    # ----------------------------------------------------------
    # 1. Copy project files
    # ----------------------------------------------------------
    - name: Create deployment directory
      file:
        path: "{{ deploy_path }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Sync project files (excluding .git, node_modules, .venv)
      synchronize:
        src: "{{ playbook_dir }}/../"
        dest: "{{ deploy_path }}/"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=.venv"
          - "--exclude=__pycache__"
          - "--exclude=dist"
          - "--exclude=coverage"
        delete: true

    # ----------------------------------------------------------
    # 2. Production .env (local-only, ver .gitignore)
    # ----------------------------------------------------------
    - name: Check .env.production exists locally
      stat:
        path: "{{ playbook_dir }}/files/.env.production"
      register: prod_env

    - name: Fail if .env.production is missing
      fail:
        msg: >-
          ansible/files/.env.production no existe. Está en .gitignore (local-only);
          mantené una copia local — el playbook la copia a la EC2.
      when: not prod_env.stat.exists

    - name: Copy production .env file
      copy:
        src: "{{ playbook_dir }}/files/.env.production"
        dest: "{{ deploy_path }}/.env"
        owner: ec2-user
        group: ec2-user
        mode: "0600"

    # ----------------------------------------------------------
    # 3. Docker Compose up
    # ----------------------------------------------------------
    - name: Build and start containers
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_path }}"
        state: present
        build: policy
      register: compose_result

    - name: Show compose output
      debug:
        var: compose_result.stdout
      when: compose_result.changed

    # ----------------------------------------------------------
    # 4. Connect app network to nginx-global (idempotente)
    # ----------------------------------------------------------
    - name: Connect {{ project_name }}-net to nginx-global
      command: docker network connect {{ project_name }}-net nginx-global
      register: connect_result
      changed_when: "'already connected' not in connect_result.stderr"
      failed_when: connect_result.rc != 0 and 'already connected' not in connect_result.stderr

    - name: Wait for frontend to be reachable
      uri:
        url: "http://localhost:5173"
        status_code: [200, 404]
      register: frontend_health
      retries: 30
      delay: 5
      until: frontend_health.status in [200, 404]

    # ----------------------------------------------------------
    # 5. Nginx site config (canónico: ansible/files/nginx/telemetry.conf)
    # ----------------------------------------------------------
    - name: Copy Nginx site configuration
      copy:
        src: "{{ playbook_dir }}/files/nginx/telemetry.conf"
        dest: "{{ nginx_conf_dir }}/{{ project_name }}.conf"
        mode: "0644"
      register: nginx_config

    # ----------------------------------------------------------
    # 6. Validate and reload Nginx (NEVER restart)
    # ----------------------------------------------------------
    - name: Validate Nginx configuration
      command: docker exec nginx-global nginx -t
      changed_when: false

    - name: Reload Nginx (no restart, no downtime)
      command: docker exec nginx-global nginx -s reload
      when: nginx_config.changed
