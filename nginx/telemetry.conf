# ────────────────────────────────────────────────────────────────────────────
# nginx de la APP telemetry — routing INTERNO de la aplicación
# Vive en /opt/apps/telemetry/nginx/ (montado dentro del contenedor
# telemetry-nginx). El nginx-global NO conoce nada de esto: solo redirige
# el subdominio a telemetry-nginx:80.
# ────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name telemetry.artisandevs.site;

    # Frontend (servido por el contenedor frontend-react, sin nginx propio)
    location / {
        proxy_pass http://frontend-react:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (sin barra final: /api/... llega intacto al backend)
    location /api/ {
        proxy_pass http://backend-nestjs:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana (acceso desde el header del dashboard, bajo /grafana/)
    location /grafana/ {
        proxy_pass http://dashboard-grafana:3000/grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (socket.io)
    location /socket.io/ {
        proxy_pass http://backend-nestjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
