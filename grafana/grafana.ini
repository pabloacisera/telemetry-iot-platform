# Minimal Grafana config for internal-only use behind Nginx.
# Authentication is kept (not anonymous) but with a known admin password via env var.

[server]
root_url = %(protocol)s://%(domain)s:%(http_port)s/grafana/
serve_from_sub_path = true

[security]
admin_user = admin
# admin_password is set via GF_SECURITY_ADMIN_PASSWORD env var

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/historical.json
